<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bloven Control — Login</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Calistoga&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >
</head>

<body class="admin-login-page">

    <main class="login-shell">

        <!-- LEFT SIDE -->

        <section class="login-introduction">

            <a
                href="../index.html"
                class="login-logo"
            >
                BLOVEN
            </a>

            <div class="login-introduction-content">

                <p class="login-eyebrow">
                    PRIVATE CONTROL
                </p>

                <h1>
                    The work behind
                    <em>the beauty.</em>
                </h1>

                <p>
                    Manage bookings, clients, payments and
                    event operations from one private space.
                </p>

            </div>

            <div class="login-footer-note">
                BLOVEN DECOR · KAMPALA
            </div>

        </section>


        <!-- LOGIN -->

        <section class="login-panel">

            <div class="login-panel-inner">

                <div class="login-heading">

                    <span>
                        ADMINISTRATION
                    </span>

                    <h2>
                        Welcome back.
                    </h2>

                    <p>
                        Sign in to access Bloven Control.
                    </p>

                </div>


                <form
                    id="adminLoginForm"
                    class="admin-login-form"
                >

                    <div class="admin-field">

                        <label for="adminEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="adminEmail"
                            name="email"
                            autocomplete="email"
                            placeholder="admin@example.com"
                            required
                        >

                    </div>


                    <div class="admin-field">

                        <label for="adminPassword">
                            Password
                        </label>

                        <div class="password-field">

                            <input
                                type="password"
                                id="adminPassword"
                                name="password"
                                autocomplete="current-password"
                                placeholder="Your password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                aria-label="Show password"
                            >
                                SHOW
                            </button>

                        </div>

                    </div>


                    <div
                        class="admin-login-error"
                        id="adminLoginError"
                        role="alert"
                    ></div>


                    <button
                        type="submit"
                        class="admin-login-button"
                        id="adminLoginButton"
                    >

                        <span>
                            SIGN IN
                        </span>

                        <b>
                            ↗
                        </b>

                    </button>

                </form>


                <a
                    href="../index.html"
                    class="return-site"
                >
                    ← Return to website
                </a>

            </div>

        </section>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/admin-auth.js"></script>

</body>
</html>
